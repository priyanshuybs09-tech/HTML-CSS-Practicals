<head>

  <title>Inline and Internal CSS</title>
  <style>
    h1 { color: navy; }
    .highlight { background-color: yellow; }
  </style>

<body>
  <h1>Navy Heading</h1>
  <p style="color: red;">This paragraph is red (inline style).</p>
  <p class="highlight">This paragraph has a yellow background (internal style).</p>
